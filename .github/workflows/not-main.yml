name: CI for non-main branches

on:
  push:
    branches-ignore:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and node
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: CodeCov
        uses: codecov/codecov-action@v4.5.0
